name: Deploy production

on:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_PORT: ${{ secrets.PROD_PORT }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_NODEBB_PATH: ${{ secrets.PROD_NODEBB_PATH }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          : "${PROD_HOST:?missing PROD_HOST secret}"
          : "${PROD_PORT:?missing PROD_PORT secret}"
          : "${PROD_USER:?missing PROD_USER secret}"
          : "${PROD_NODEBB_PATH:?missing PROD_NODEBB_PATH secret}"
          : "${PROD_SSH_PRIVATE_KEY:?missing PROD_SSH_PRIVATE_KEY secret}"
          : "${PROD_KNOWN_HOSTS:?missing PROD_KNOWN_HOSTS secret}"

      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "${{ secrets.PROD_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Verify local runtime safety
        run: |
          node ./scripts/verify-local-runtime.mjs

      - name: Verify sync safety
        run: |
          bash ./scripts/verify-sync-safety.sh

      - name: Verify remote overlay path permissions
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${PROD_PORT}" -i "$HOME/.ssh/id_ed25519" \
            "${PROD_USER}@${PROD_HOST}" 'bash -se' <<EOF
          set -euo pipefail

          target_root="${PROD_NODEBB_PATH}"
          probe_paths=(
            "${PROD_NODEBB_PATH}"
            "${PROD_NODEBB_PATH}/src"
            "${PROD_NODEBB_PATH}/src/views"
            "${PROD_NODEBB_PATH}/public"
            "${PROD_NODEBB_PATH}/types"
          )

          echo "[deploy] remote user: \$(id -un)"
          echo "[deploy] remote groups: \$(id -Gn)"
          echo "[deploy] checking write access under: ${PROD_NODEBB_PATH}"

          for path in "\${probe_paths[@]}"; do
            [[ -e "\$path" ]] || continue

            if [[ ! -w "\$path" ]]; then
              echo "[deploy] remote path is not writable: \$path" >&2
              ls -ld "\$path" >&2 || true
              stat -c '%U:%G %a %n' "\$path" >&2 || true
              exit 1
            fi
          done

          if [[ ! -w "\$target_root" ]]; then
            echo "[deploy] deployment root is not writable: \$target_root" >&2
            ls -ld "\$target_root" >&2 || true
            stat -c '%U:%G %a %n' "\$target_root" >&2 || true
            exit 1
          fi
          EOF

      - name: Sync repository overlay
        run: |
          rsync -az \
            --exclude-from='.deployignore' \
            -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p ${PROD_PORT} -i $HOME/.ssh/id_ed25519" \
            ./ "${PROD_USER}@${PROD_HOST}:${PROD_NODEBB_PATH}/"

      - name: Run remote deployment script
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${PROD_PORT}" -i "$HOME/.ssh/id_ed25519" \
            "${PROD_USER}@${PROD_HOST}" \
            "cd '${PROD_NODEBB_PATH}' && ./scripts/deploy-prod.sh"

  resync_production_plugins:
    needs: deploy
    permissions:
      contents: write
    uses: ./.github/workflows/resync-production-plugins.yml
    secrets: inherit
