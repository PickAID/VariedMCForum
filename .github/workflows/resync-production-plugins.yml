name: Sync production extension state

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      PROD_HOST:
        required: true
      PROD_PORT:
        required: true
      PROD_USER:
        required: true
      PROD_NODEBB_PATH:
        required: true
      PROD_SSH_PRIVATE_KEY:
        required: true
      PROD_KNOWN_HOSTS:
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: write

concurrency:
  group: production-extension-state-sync
  cancel-in-progress: true

jobs:
  resync:
    runs-on: ubuntu-latest
    env:
      PROD_HOST: ${{ secrets.PROD_HOST }}
      PROD_PORT: ${{ secrets.PROD_PORT }}
      PROD_USER: ${{ secrets.PROD_USER }}
      PROD_NODEBB_PATH: ${{ secrets.PROD_NODEBB_PATH }}
      BASE_BRANCH: main
      TARGET_BRANCH: main
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate resync secrets
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          : "${PROD_HOST:?missing PROD_HOST secret}"
          : "${PROD_PORT:?missing PROD_PORT secret}"
          : "${PROD_USER:?missing PROD_USER secret}"
          : "${PROD_NODEBB_PATH:?missing PROD_NODEBB_PATH secret}"
          : "${PROD_SSH_PRIVATE_KEY:?missing PROD_SSH_PRIVATE_KEY secret}"
          : "${PROD_KNOWN_HOSTS:?missing PROD_KNOWN_HOSTS secret}"

      - name: Configure SSH
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "${{ secrets.PROD_KNOWN_HOSTS }}" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Prepare sync branch
        run: |
          git fetch origin "${BASE_BRANCH}"
          git switch -C "${TARGET_BRANCH}" "origin/${BASE_BRANCH}"

      - name: Capture production extension state
        run: |
          mkdir -p state
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -p "${PROD_PORT}" -i "$HOME/.ssh/id_ed25519" \
            "${PROD_USER}@${PROD_HOST}" "cd \"${PROD_NODEBB_PATH}\" && node -" <<'NODE' > state/production-nodebb-extensions.json
          const fs = require('fs');
          const path = require('path');
          const { MongoClient } = require('mongodb');

          const extensionPattern = /^(?:@[\w-]+\/)?nodebb-(plugin|theme|widget|rewards)-[\w-]+$/;

          function classifyExtension(name) {
            const match = name.match(/nodebb-(plugin|theme|widget|rewards)-/);
            return match ? match[1] : 'unknown';
          }

          function readJson(filePath) {
            return JSON.parse(fs.readFileSync(filePath, 'utf8'));
          }

          function packagePathFor(root, packageName) {
            if (packageName.startsWith('@')) {
              const [scope, scopedName] = packageName.split('/');
              return path.join(root, 'node_modules', scope, scopedName, 'package.json');
            }
            return path.join(root, 'node_modules', packageName, 'package.json');
          }

          function resolveMongoUri(config) {
            if (config.mongo && typeof config.mongo.uri === 'string' && config.mongo.uri) {
              return config.mongo.uri;
            }

            const mongo = config.mongo || {};
            const host = mongo.host || '127.0.0.1';
            const port = mongo.port || 27017;
            const database = mongo.database;

            if (!database) {
              throw new Error('config.json missing mongo.database');
            }

            let auth = '';
            if (mongo.username) {
              auth = encodeURIComponent(mongo.username);
              if (mongo.password) {
                auth += `:${encodeURIComponent(mongo.password)}`;
              }
              auth += '@';
            }

            const params = new URLSearchParams();
            if (mongo.authSource) {
              params.set('authSource', mongo.authSource);
            }

            return `mongodb://${auth}${host}:${port}/${database}${params.toString() ? `?${params.toString()}` : ''}`;
          }

          function resolveMongoDatabaseName(config, mongoUri) {
            const parsed = new URL(mongoUri);
            const pathName = parsed.pathname.replace(/^\/+/, '');
            return pathName || (config.mongo && config.mongo.database) || 'nodebb';
          }

          function collectDeclaredExtensions(pkg) {
            return Object.entries(pkg.dependencies || {})
              .filter(([name]) => extensionPattern.test(name))
              .map(([name, spec]) => ({
                name,
                kind: classifyExtension(name),
                declaredSpec: spec,
              }))
              .sort((a, b) => a.name.localeCompare(b.name));
          }

          function collectInstalledExtensions(root) {
            const results = [];
            const nodeModulesDir = path.join(root, 'node_modules');

            if (!fs.existsSync(nodeModulesDir)) {
              return results;
            }

            for (const entry of fs.readdirSync(nodeModulesDir, { withFileTypes: true })) {
              if (entry.name.startsWith('@')) {
                const scopeDir = path.join(nodeModulesDir, entry.name);
                for (const scopedEntry of fs.readdirSync(scopeDir, { withFileTypes: true })) {
                  const packageName = `${entry.name}/${scopedEntry.name}`;
                  if (!extensionPattern.test(packageName)) {
                    continue;
                  }

                  const packageJsonPath = packagePathFor(root, packageName);
                  const packageJson = fs.existsSync(packageJsonPath) ? readJson(packageJsonPath) : null;
                  results.push({
                    name: packageName,
                    kind: classifyExtension(packageName),
                    installedVersion: packageJson && packageJson.version ? packageJson.version : null,
                  });
                }
                continue;
              }

              if (!extensionPattern.test(entry.name)) {
                continue;
              }

              const packageJsonPath = packagePathFor(root, entry.name);
              const packageJson = fs.existsSync(packageJsonPath) ? readJson(packageJsonPath) : null;
              results.push({
                name: entry.name,
                kind: classifyExtension(entry.name),
                installedVersion: packageJson && packageJson.version ? packageJson.version : null,
              });
            }

            return results.sort((a, b) => a.name.localeCompare(b.name));
          }

          function collectLocalSourceDirs(root) {
            return fs.readdirSync(root, { withFileTypes: true })
              .filter(entry => entry.isDirectory())
              .map((entry) => {
                const dirPath = path.join(root, entry.name);
                const pluginJsonPath = path.join(dirPath, 'plugin.json');
                const packageJsonPath = path.join(dirPath, 'package.json');
                if (!fs.existsSync(pluginJsonPath) || !fs.existsSync(packageJsonPath)) {
                  return null;
                }

                const pkg = readJson(packageJsonPath);
                return {
                  dir: entry.name,
                  name: pkg.name || null,
                };
              })
              .filter(Boolean)
              .sort((a, b) => a.dir.localeCompare(b.dir));
          }

          function collectWarnings(declaredExtensions, root, localSourceDirs) {
            const warnings = [];
            const localSourceDirByName = new Map(localSourceDirs.map(item => [item.name, item.dir]));

            for (const extension of declaredExtensions) {
              if (!String(extension.declaredSpec).startsWith('file:')) {
                continue;
              }

              const target = extension.declaredSpec.slice(5);
              const resolvedTarget = path.resolve(root, target);
              const issues = [];
              let localPackageName = null;

              if (!fs.existsSync(resolvedTarget)) {
                issues.push('missing target directory');
              } else {
                const packageJsonPath = path.join(resolvedTarget, 'package.json');
                const pluginJsonPath = path.join(resolvedTarget, 'plugin.json');
                if (!fs.existsSync(packageJsonPath)) {
                  issues.push('missing package.json');
                } else {
                  localPackageName = readJson(packageJsonPath).name || null;
                }
                if (!fs.existsSync(pluginJsonPath)) {
                  issues.push('missing plugin.json');
                }
              }

              if (issues.length) {
                warnings.push({
                  type: 'file-dependency-integrity',
                  name: extension.name,
                  declaredSpec: extension.declaredSpec,
                  target,
                  localSourceDir: localSourceDirByName.get(extension.name) || null,
                  localPackageName,
                  issues,
                });
              }
            }

            return warnings;
          }

          async function collectActiveExtensions(config) {
            const mongoUri = resolveMongoUri(config);
            const dbName = resolveMongoDatabaseName(config, mongoUri);
            const client = new MongoClient(mongoUri);

            try {
              await client.connect();
              return await client.db(dbName).collection('objects')
                .find({ _key: 'plugins:active' }, { projection: { _id: 0, value: 1, score: 1 } })
                .sort({ score: 1, value: 1 })
                .toArray();
            } finally {
              await client.close();
            }
          }

          (async () => {
            const root = process.cwd();
            const pkg = readJson(path.join(root, 'package.json'));
            const config = readJson(path.join(root, 'config.json'));
            const declaredExtensions = collectDeclaredExtensions(pkg);
            const installedExtensions = collectInstalledExtensions(root);
            const localSourceDirs = collectLocalSourceDirs(root);
            const warnings = collectWarnings(declaredExtensions, root, localSourceDirs);
            const activeExtensions = await collectActiveExtensions(config);

            const declaredMap = new Map(declaredExtensions.map(item => [item.name, item]));
            const installedMap = new Map(installedExtensions.map(item => [item.name, item]));
            const activeMap = new Map(activeExtensions.map(item => [item.value, item.score]));
            const localSourceMap = new Map(localSourceDirs.map(item => [item.name, item.dir]));
            const names = Array.from(new Set([
              ...declaredMap.keys(),
              ...installedMap.keys(),
              ...activeMap.keys(),
            ])).sort((a, b) => a.localeCompare(b));

            const extensions = names.map((name) => ({
              name,
              kind: classifyExtension(name),
              declared: declaredMap.has(name),
              declaredSpec: declaredMap.has(name) ? declaredMap.get(name).declaredSpec : null,
              installed: installedMap.has(name),
              installedVersion: installedMap.has(name) ? installedMap.get(name).installedVersion : null,
              active: activeMap.has(name),
              activeOrder: activeMap.has(name) ? activeMap.get(name) : null,
              localSourceDir: localSourceMap.get(name) || null,
            }));

            const output = {
              schemaVersion: 1,
              capturedAt: new Date().toISOString(),
              runtime: {
                nodebbVersion: pkg.version,
                nodeVersion: process.version,
                database: config.database,
              },
              activeExtensions: activeExtensions.map(item => item.value),
              localSourceDirs,
              extensions,
              warnings,
            };

            process.stdout.write(`${JSON.stringify(output, null, 2)}\n`);
          })().catch((err) => {
            console.error(err.stack || String(err));
            process.exit(1);
          });
          NODE

      - name: Validate extension state snapshot
        run: |
          node ./scripts/sync-nodebb-extension-state.mjs validate-state
          bash ./scripts/verify-production-extension-state-sync.sh

      - name: Commit and push synced extension state
        run: |
          if git diff --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo "No extension state changes detected."
            exit 0
          fi

          git add state/production-nodebb-extensions.json
          if git diff --cached --quiet; then
            echo "No extension state changes staged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync production extension state [skip deploy]"
          git push origin "HEAD:${TARGET_BRANCH}"
